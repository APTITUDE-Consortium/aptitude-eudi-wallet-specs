# Project information
site_name: APTITUDE Technical Specification
site_description: APTITUDE Technical Specification
site_author: APTITUDE Consortium
site_url: https://aptitude-consortium.github.io/aptitude-eudi-wallet-specs/

# Repository
repo_name: APTITUDE-Consortium/aptitude-eudi-wallet-specs
repo_url: https://github.com/APTITUDE-Consortium/aptitude-eudi-wallet-specs
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 APTITUDE Consortium

# Configuration for MkDocs Material theme
theme:
  name: material
  custom_dir: docs/overrides
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  logo: img/logo.png

extra:
  version:
    provider: mike
    alias: true

extra_css:
  - media/extra.css

extra_javascript:
  - media/mermaid.min.js
  - media/mermaid-init.js
  - media/mathjax-init.js
  - media/mathjax-tex-mml-chtml.js

hooks:
  - script/mkdocs_catalogue.py

plugins:
  - tags
  - exclude:
      glob:
        - 'catalogue/_template/**'
        - 'rulebook/wp2-trust-specifications/README.md'
        - 'rulebook/wp2-trust-specifications/CONTRIBUTING.md'
        - 'rulebook/wp2-trust-specifications/terminology.md'
        - 'rulebook/wp2-trust-specifications/references/**'
        - 'rulebook/wp2-trust-specifications/requirements/**'
        - 'rulebook/wp2-trust-specifications/topics/**'
        - 'rulebook/wp2-trust-specifications/docs/examples/**'
        - 'rulebook/wp2-trust-specifications/docs/topics/**'
  - include-markdown:
      comments: true
  - search
  - ezglossary:
      strict: true
      ignore_case: true
      plurals: en
      markdown_links: true
      tooltip: full
      templates: docs/overrides/ezglossary
      sections:
        - roles
        - components
        - artifacts
        - credentials
        - protocols
        - processes
        - formats
        - data-elements
  - git-revision-date-localized:
      locale: en
      fallback_to_build_date: true
      type: datetime


markdown_extensions:
  - footnotes
  - sane_lists
  - tables
  - md_in_html
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md
  - Attestation Rulebooks:
    - Overview: rulebook/index.md
    - mVRC: rulebook/wp5/mVRC-rulebook.md
    - DTC: rulebook/wp3/dtc-rulebook.md
  - Attestation Catalogue:
    - Overview: catalogue/index.md
    - Structure: catalogue/structure.md
    - Publishing in the registry: catalogue/registry.md
    - Origin of the first types: catalogue/origin.md
    - Alignment with WE BUILD: catalogue/alignment-with-webuild.md
    - Rulebooks:
      - EU Company Certificate: catalogue/rulebooks/rb-eu-company-certificate/README.md
      - IBAN Attestation: catalogue/rulebooks/rb-iban-attestation/README.md
      - IBAN Attestation for Individuals: catalogue/rulebooks/rb-iban-attestation-for-individuals/README.md
      - ID Proofing ETSI 119 461: catalogue/rulebooks/rb-idproofing-etsi461/README.md
      - Legal Person Identification Data (LPID): catalogue/rulebooks/rb-legal-person-identification-data/README.md
      - Signatory Rights: catalogue/rulebooks/rb-signatory-rights-attestation/README.md
      - Ultimate Beneficial Owners: catalogue/rulebooks/rb-ultimate-beneficial-owners-attestation/README.md
  - Trust Specifications:
    - Trust Framework:
      - Overview: rulebook/wp2-trust-specifications/docs/trust-framework.md
      - Trust Architecture: rulebook/wp2-trust-specifications/docs/sections/trust-architecture.md
      - Trust Artifacts: rulebook/wp2-trust-specifications/docs/sections/trust-artifacts.md
      - Onboarding Process: rulebook/wp2-trust-specifications/docs/sections/onboarding-process.md
      - Trust Evaluation: rulebook/wp2-trust-specifications/docs/sections/trust-evaluation-process.md
      - Trust Management and Lifecycle: rulebook/wp2-trust-specifications/docs/sections/trust-management-lifecycle.md
      - Trust Use Cases: rulebook/wp2-trust-specifications/docs/sections/use-cases.md
      - References: rulebook/wp2-trust-specifications/docs/sections/references.md
  - RFCs:
    - Overview: RFCs/index.md
    - Generic Issuance Flow: wp2/generic-issuance-flow-specification.md
    - Generic Remote Presentation Flow: wp2/Generic-remote-presentation-flow-specification.md
    - RFC-01 Credential Issuance Profile: RFCs/RFC001.md
    - RFC-02 Presentation Profile: RFCs/RFC002.md
    - RFC-03 Trust Evaluation: RFCs/RFC003.md
    - RFC-04 Revocation Profile: RFCs/RFC004.md
    - RFC-05 Proximity Presentation Profile: RFCs/RFC005.md
  - Testing and Conformance:
    - Overview: itb_plus_user_onboarding/index.md
    - ITB+ User Onboarding Guide: itb_plus_user_onboarding/aptitude-itb-user-onboarding-manual.md
    - Reporting Conformance Results: itb_plus_user_onboarding/report-submission.md
  - Schemas:
    - Overview: schema/index.md
  - Standards: standards.md
  - Glossary: 
    - Glossary: glossary.md
    - Definitions: glossary-definitions.md

