name: Update submodule wp2-trust-specifications 

on:
  repository_dispatch:
    types: 
        - pr-closed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'repository_dispatch' &&
        github.event.action == 'pr-closed' &&
        github.event.client_payload.source_full == 'APTITUDE-Consortium/wp2-trust-specifications' &&
        github.event.client_payload.pr_merged == true &&
        github.event.client_payload.target_branch == 'main'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update wp2-trust-specifications submodule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git submodule update --remote docs/rulebook/wp2-trust-specifications 
          
      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request for submodule update
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update wp2-trust-specifications submodule"
          branch: "chore/update-wp2-trust-submodule"
          base: "main"
          title: "chore: update wp2-trust-specifications submodule"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          body: |
            Automated update of `docs/rulebook/wp2-trust-specifications` submodule pointer.
