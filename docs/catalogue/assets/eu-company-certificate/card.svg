<svg xmlns="http://www.w3.org/2000/svg" width="400" height="252" viewBox="0 0 400 252">
  <title>EU Company Certificate</title>
  <rect width="400" height="252" rx="16" ry="16" fill="#0E5A63"/>
  <text x="24" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">EU Company Certificate</text>
  <text x="24" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF">EU Company Certificate</text>
  <text x="24" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Name: {{legal_person_name}}</text>
  <text x="24" y="134" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">ID: {{legal_person_id}}</text>
  <text x="24" y="160" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Form: {{legal_form_type}}</text>
  <text x="24" y="186" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Status: {{legal_person_status}}</text>
  <text x="376" y="232" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF">Expires: {{expiry_date}}</text>
</svg>
