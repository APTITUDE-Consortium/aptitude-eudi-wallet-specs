<svg xmlns="http://www.w3.org/2000/svg" width="400" height="252" viewBox="0 0 400 252">
  <title>Ferry Boarding Pass</title>
  <rect width="400" height="252" rx="16" fill="#5B2A86"/>
  <text x="24" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Ferry Boarding Pass</text>
  <text x="24" y="68" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF">Verifiable boarding pass</text>
  <line x1="24" y1="82" x2="376" y2="82" stroke="#FFFFFF" stroke-opacity="0.5"/>
  <text x="24" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">{{firstName}} {{lastName}}</text>
  <text x="24" y="142" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Ticket: {{ticketNumber}}</text>
  <text x="24" y="172" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Seat: {{seatType}} {{seatNumber}}</text>
  <text x="24" y="202" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Departure: {{departureDate}} {{departureTime}}</text>
  <text x="24" y="232" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Arrival port: {{arrivalPort}}</text>
</svg>
