<svg xmlns="http://www.w3.org/2000/svg" width="400" height="252" viewBox="0 0 400 252">
  <title>Photo ID</title>
  <rect width="400" height="252" rx="16" ry="16" fill="#0B2A5B"/>
  <text x="24" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Photo ID</text>
  <line x1="24" y1="60" x2="376" y2="60" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  <text x="24" y="95" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Family name: {{family_name_unicode}}</text>
  <text x="24" y="125" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Given name: {{given_name_unicode}}</text>
  <text x="24" y="155" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Born: {{birth_date}}</text>
  <text x="24" y="185" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Document no: {{document_number}}</text>
  <text x="24" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF">Expires: {{expiry_date}}</text>
</svg>
